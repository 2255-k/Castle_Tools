apiVersion: apps/v1
kind: Deployment
metadata:
  name: castle-tools
  labels:
    app: castle-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: castle-tools
  template:
    metadata:
      labels:
        app: castle-tools
    spec:
      containers:
        - name: castle-tools
          image: 398142519746.dkr.ecr.ap-southeast-2.amazonaws.com/castle-tools:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
